name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .

  # The Web Bot Auth gates, in order: the ruff format check, the ruff lint,
  # the seam boundary, the structural rules, the import contracts, mypy
  # strict, and the behavior suite with its coverage floor.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run the Web Bot Auth quality gates
        run: make quality

  # The interop tests, which pytest deselects by default: Cloudflare's
  # web-bot-auth signs and verifies against this library through Node.
  web-bot-auth-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the interop harness against the module's adapter
        run: make interop
