[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iab-agentic-primitives"
version = "0.1.0"
description = "Shared contract library for IAB agentic advertising: primitives, wire protocol, state machines, conformance vectors"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iab_agentic_primitives"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
