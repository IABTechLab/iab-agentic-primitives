[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iab-agentic-primitives"
version = "0.5.1"
description = "Shared contract library for IAB agentic advertising: primitives, wire protocol, state machines, conformance vectors"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# RegistryClient (httpx-based); the core primitives never require it.
client = [
    "httpx>=0.27",
]
# Local sandbox AAMP registry app; the core primitives never require it.
sandbox = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# In-process two-agent interop harness (EP-7.1). The role interfaces,
# reference agents, and assertions import only pydantic; the scenario runner
# drives the sandbox registry in-process (httpx ASGITransport + fastapi).
harness = [
    "httpx>=0.27",
    "fastapi>=0.110",
]
# Web Bot Auth profile (iab_agentic_primitives.web_bot_auth): request and
# response signing, the signed key directory, and the resolver. This list is
# the module's whole dependency set; the ASGI helpers are plain ASGI and need
# nothing more.
wba = [
    # RFC 9421 signature bases, Ed25519 sign and verify, the ;key and ;req
    # component parameters, and RFC 9530 Content-Digest. Pinned exactly: the
    # module subclasses HTTPMessageVerifier, and a contract test guards it.
    "http-message-signatures==3.0.0",
    # RFC 8941 / RFC 9651 Structured Fields for Signature, Signature-Input, and
    # Signature-Agent, with duplicate keys refused.
    "http-sf>=1.5,<2",
    # JWK and RFC 7638 / RFC 8037 thumbprints for OKP (Ed25519) keys.
    "joserfc>=1.7.5,<2",
    # IDNA-2008 (UTS #46) host canonicalization for the origin rule.
    "idna>=3.7,<4",
    "cryptography>=45.0.1",
    # Directory fetches go through an httpx.AsyncClient the caller can inject.
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # test deps for the sandbox registry + registry client (the extras above)
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # The wba extra, with the same pins, so that `uv run pytest` runs the Web
    # Bot Auth suite instead of skipping it. The extra stays for consumers.
    "http-message-signatures==3.0.0",
    "http-sf>=1.5,<2",
    "joserfc>=1.7.5,<2",
    "idna>=3.7,<4",
    "cryptography>=45.0.1",
    "httpx>=0.28.1,<1",
    # The Web Bot Auth quality gates (`make quality`). Declared here so that
    # `uv run <tool>` resolves to a locked copy, locally and in CI.
    "mypy>=1.18.2",
    # Exact, not a floor: how `# ast-grep-ignore:` directives are honoured has
    # changed between releases, so a floor could silently change what the
    # structural rules in .ast-grep/rules/ report.
    "ast-grep-cli==0.45.3",
    "import-linter>=2.1",
    "pytest-cov>=6.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iab_agentic_primitives"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A parametrize over an empty list fails collection instead of skipping, so a
# generated case table that comes back empty cannot pass silently.
empty_parameter_set_mark = "fail_at_collect"
# An xfail that passes fails the run, so an exemption can't outlive its reason.
xfail_strict = true
# The interop tests need Node and the harness's libraries; `make interop` and
# CI's web-bot-auth-interop job select them with `-m interop`.
markers = ["interop: Web Bot Auth interop with Cloudflare's library, through Node"]
addopts = ["-m", "not interop"]

[tool.ruff]
line-length = 100
target-version = "py312"

# mypy runs only through `make typecheck` (the Web Bot Auth gate). The
# overrides match the web_bot_auth module and its tests alone, so upstream
# modules are not held to these settings.
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "iab_agentic_primitives.web_bot_auth.*"
strict = true
disallow_any_explicit = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.web_bot_auth.*"
strict = true
disallow_any_explicit = true
enable_error_code = ["truthy-bool", "possibly-undefined"]
