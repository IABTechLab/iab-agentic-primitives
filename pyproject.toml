[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iab-agentic-primitives"
version = "0.1.0"
description = "Shared contract library for IAB agentic advertising: primitives, wire protocol, state machines, conformance vectors"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# RegistryClient (httpx-based); the core primitives never require it.
client = [
    "httpx>=0.27",
]
# Local sandbox AAMP registry app; the core primitives never require it.
sandbox = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # test deps for the sandbox registry + registry client (the extras above)
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iab_agentic_primitives"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
